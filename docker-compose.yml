services:
  postgres:
    image: postgres:16-alpine
    container_name: bdcrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bdcrm
      POSTGRES_PASSWORD: bdcrm_dev_pwd
      POSTGRES_DB: bd_crm
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5433:5432" # 本机 5432 已被占用，映射到 5433
    volumes:
      - bdcrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdcrm -d bd_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bdcrm_pgdata:

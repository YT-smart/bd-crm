# HTTP 一律跳转到 HTTPS（用 IP 打开也跳到域名，否则证书对不上）
server {
    listen 80 default_server;
    server_name _;
    return 301 https://elegocrm.com$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name elegocrm.com www.elegocrm.com;
    client_max_body_size 20m;

    # 证书放在服务器 /opt/bdcrm/ssl/，不进代码仓库
    ssl_certificate     /etc/nginx/ssl/elegocrm.com.pem;
    ssl_certificate_key /etc/nginx/ssl/elegocrm.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 打包产物文件名带内容哈希，内容变了文件名就变，可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口页不缓存：每次打开都向服务器确认，部署后直接拿到新版
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
